<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrarse</title>
</head>
<body>

    <a href="../CssP2y3/ejercicio2.html">Volver</a>

    <h2>Crear Cuenta</h2>

    <form>
        <div>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
        </div>
        <br>
        <div>
            <label for="apellido">Apellido:</label><br>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido">
        </div>
        <br>
        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
        </div>
        <br>
        <div>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" placeholder="Crea una contraseña">
        </div>
        <br>
        <div>
            <label for="password2">Confirmar Contraseña:</label><br>
            <input type="password" id="password2" name="password2" placeholder="Repite la contraseña">
        </div>
        <br>
        <div>
            <input type="submit" value="Registrarse">
        </div>
    </form>

</body>
</html>
